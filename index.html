<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Time &amp; Earn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Time & Earn">
<meta name="theme-color" content="#2343c4">
<style>
/* Layout: one-column phone app shell — sticky top bar, scrolling content, fixed tab bar; editors open as bottom sheets. */
:root {
  --bg: #f1f4f2; --surface: #ffffff; --surface-2: #e7ece9; --ink: #142019; --muted: #56645d; --line: #d4dcd7;
  --accent: #2343c4; --accent-ink: #ffffff; --accent-soft: #e1e7fb; --plan: #9fb0ee;
  --unalloc: #e2e6e4; --unalloc-line: #cfd6d2; --danger: #b8322a; --danger-soft: #fbe5e2; --warn: #8a5600; --warn-soft: #fbefd6; --ok: #1c7543;
  --today: #fff3c4; --shadow: 0 1px 2px rgba(20,32,25,.06), 0 8px 24px rgba(20,32,25,.08);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r: 14px; --hourw: 34px; --datew: 66px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1311; --surface: #171e1b; --surface-2: #212a26; --ink: #e6ede9; --muted: #9babA3; --line: #2c3632;
  --accent: #91a6ff; --accent-ink: #0e1311; --accent-soft: #1d2647; --plan: #3d4b86;
  --unalloc: #262f2b; --unalloc-line: #323d38; --danger: #ff8b80; --danger-soft: #3a1d1a; --warn: #f2b24c; --warn-soft: #33270f; --ok: #6ed39b;
  --today: #3a3413; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1311; --surface: #171e1b; --surface-2: #212a26; --ink: #e6ede9; --muted: #9babA3; --line: #2c3632;
  --accent: #91a6ff; --accent-ink: #0e1311; --accent-soft: #1d2647; --plan: #3d4b86;
  --unalloc: #262f2b; --unalloc-line: #323d38; --danger: #ff8b80; --danger-soft: #3a1d1a; --warn: #f2b24c; --warn-soft: #33270f; --ok: #6ed39b;
  --today: #3a3413; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num, td.n, .money { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
small, .muted { color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* shell */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; min-height: 52px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
.brand b { color: var(--accent); }
.topbar .spacer { flex: 1; }
.demo-pill { background: var(--warn-soft); color: var(--warn); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px solid currentColor; }
main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 14px calc(150px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
main > * { min-width: 0; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 8px 4px 9px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); min-height: 56px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.fab { position: fixed; z-index: 31; right: max(16px, calc(50% - 364px)); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 99px; padding: 14px 22px 14px 18px; font-weight: 700; font-size: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; min-height: 52px; }
.fab svg { width: 22px; height: 22px; }

/* banners & cards */
.banner { border-radius: var(--r); padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.banner.err { background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); }
.banner strong { color: inherit; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { font-size: 19px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.gross-note { font-size: 12.5px; color: var(--muted); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair > div { background: var(--surface-2); border-radius: 12px; padding: 12px; display: grid; gap: 2px; min-width: 0; }
.pair .label { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.pair .big { font-family: var(--f-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.15; overflow-wrap: anywhere; }
.pair .sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.key { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.key.plan { background: repeating-linear-gradient(135deg, var(--plan) 0 3px, transparent 3px 5px); border: 1.5px solid var(--plan); }
.key.act { background: var(--accent); }
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* buttons & controls */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; min-height: 44px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 auto; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; font-size: 20px; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px 8px; font-weight: 700; font-size: 15px; min-height: 42px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.mode button[aria-pressed="true"][data-val="planned"] { box-shadow: inset 0 -3px 0 var(--plan), 0 1px 3px rgba(0,0,0,.12); }
.seg.mode button[aria-pressed="true"][data-val="actual"] { box-shadow: inset 0 -3px 0 var(--accent), 0 1px 3px rgba(0,0,0,.12); }
.mode-hint { font-size: 13px; color: var(--muted); }

/* forms */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-size: 14px; font-weight: 700; }
.field .hint { font-size: 13px; color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=month], select, textarea {
  width: 100%; min-height: 46px; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 10px 12px; font-size: 16px; -webkit-appearance: none; appearance: none; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input[type=date], input[type=time] { display: block; }
input[type=color] { width: 56px; height: 46px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); padding: 4px; }
textarea { min-height: 84px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 6px 0; font-weight: 600; }
.switch input { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); position: relative; flex: none; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked { background: var(--accent); border-color: var(--accent); }
.switch input:checked::after { transform: translateX(20px); }
.switch small { display: block; font-weight: 400; }
fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-weight: 700; font-size: 14px; padding: 0 6px; }
.errors { background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.errors ul { margin: 4px 0 0; padding-left: 18px; }
.errors strong { color: var(--danger); }
.invalid { border-color: var(--danger) !important; box-shadow: 0 0 0 1px var(--danger); }
.preview-line { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 14px; font-weight: 600; min-height: 38px; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
label.chip:has(input:checked) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.small { min-height: 30px; padding: 3px 10px; font-size: 13px; }

/* legend */
.legend { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.legend::-webkit-scrollbar { display: none; }
.lg { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px 4px 4px; }
.sw { display: inline-grid; place-items: center; min-width: 26px; height: 22px; border-radius: 6px; font-size: 11px; font-weight: 800; padding: 0 4px; letter-spacing: .02em; }
.sw.un { background: var(--unalloc); color: var(--muted); border: 1px dashed var(--unalloc-line); }

/* planner header */
.monthbar { display: flex; align-items: center; gap: 8px; }
.monthbar h1 { font-size: 24px; flex: 1; min-width: 0; }
.monthbar .mlabel { position: relative; flex: 1; min-width: 0; }
.monthbar .mlabel input { position: absolute; inset: 0; opacity: 0; width: 100%; }
.monthbar .mlabel h1 { pointer-events: none; }
.monthbar .mlabel small { display: block; font-weight: 500; pointer-events: none; }

/* month timeline */
.tl-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tl { overflow: auto; max-height: calc(100dvh - 330px); min-height: 280px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.tl-grid { width: calc(var(--datew) + 24 * var(--hourw)); }
.tl-head { display: flex; position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line); }
.tl-corner { position: sticky; left: 0; z-index: 4; width: var(--datew); flex: none; background: var(--surface); font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 8px; border-right: 1px solid var(--line); }
.tl-hours { display: flex; }
.tl-hours span { width: var(--hourw); flex: none; font-size: 10.5px; color: var(--muted); padding: 7px 0 5px 3px; font-variant-numeric: tabular-nums; border-left: 1px solid var(--line); }
.tl-row { display: flex; width: 100%; border: 0; padding: 0; background: transparent; text-align: left; border-bottom: 1px solid var(--line); min-height: 46px; }
.tl-row:last-child { border-bottom: 0; }
.tl-date { position: sticky; left: 0; z-index: 2; width: var(--datew); flex: none; background: var(--surface); border-right: 1px solid var(--line); padding: 4px 8px; display: grid; align-content: center; line-height: 1.15; }
.tl-date .wd { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tl-date .dn { font-family: var(--f-display); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tl-date .de { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-row.weekend .tl-date .wd { color: var(--accent); }
.tl-row.today .tl-date { background: var(--today); box-shadow: inset 4px 0 0 var(--accent); }
.tl-row.today { background: var(--today); }
.tl-track { position: relative; width: calc(24 * var(--hourw)); flex: none; background-color: var(--unalloc); background-image: repeating-linear-gradient(90deg, var(--unalloc-line) 0 1px, transparent 1px var(--hourw)); margin: 5px 0; border-radius: 6px; }
.bar { position: absolute; top: 0; bottom: 0; background: var(--c); border-radius: 4px; display: flex; align-items: center; overflow: hidden; box-shadow: 0 0 0 1px var(--surface); }
.bar.planned { background: repeating-linear-gradient(135deg, var(--c) 0 7px, color-mix(in srgb, var(--c) 72%, var(--surface)) 7px 10px); }
.bar em { font-style: normal; font-size: 11px; font-weight: 800; color: var(--ink2, #111); padding: 0 5px; white-space: nowrap; letter-spacing: .02em; }
.tl-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-top: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; }

/* empty state */
.empty { text-align: center; padding: 28px 18px; display: grid; gap: 10px; justify-items: center; }
.empty h2 { font-size: 21px; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }

/* sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: rgba(8,12,10,.45); animation: fade .18s ease-out; }
.sheet { position: relative; background: var(--bg); width: 100%; max-width: 640px; max-height: calc(100dvh - 24px - env(safe-area-inset-top, 0px)); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: rise .22s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
.sheet.full { height: calc(100dvh - 24px - env(safe-area-inset-top, 0px)); }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 18px; border-bottom: 1px solid var(--line); background: var(--surface); border-radius: 20px 20px 0 0; }
.sheet-head h2 { flex: 1; font-size: 19px; min-width: 0; }
.sheet-head::before { content: ""; position: absolute; top: 6px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 4px; background: var(--line); }
.sheet-body { overflow-y: auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; flex: 1; }
.sheet-body > * { min-width: 0; }
.sheet-foot { position: sticky; bottom: calc(-24px - env(safe-area-inset-bottom, 0px)); background: var(--bg); padding: 10px 0 calc(4px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; border-top: 1px solid var(--line); margin-top: 4px; }
.sheet-foot .btn { flex: 1; }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim { animation: none; } }

/* day view */
.daynav { display: flex; align-items: center; gap: 8px; }
.daynav .dt { flex: 1; text-align: center; font-weight: 700; }
.totals3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.totals3 > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 2px; min-width: 0; }
.totals3 .t { font-size: 12px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.totals3 .v { font-family: var(--f-display); font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.2; }
.totals3 .s { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.alist { display: grid; gap: 8px; }
.aitem { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; min-height: 56px; }
.aitem .sw { min-width: 34px; height: 34px; border-radius: 9px; font-size: 12px; }
.aitem .nm { font-weight: 700; overflow-wrap: anywhere; }
.aitem .tm { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.aitem .rt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
.aitem .rt small { display: block; font-weight: 500; }
.aitem.cont { border-style: dashed; }
.vt { display: grid; grid-template-columns: 44px 1fr 1fr; gap: 6px; }
.vt-col { position: relative; height: calc(24 * 30px); background-color: var(--unalloc); background-image: repeating-linear-gradient(180deg, var(--unalloc-line) 0 1px, transparent 1px 30px); border-radius: 8px; }
.vt-hours { position: relative; height: calc(24 * 30px); }
.vt-hours span { position: absolute; right: 2px; font-size: 11px; color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.vt-head { font-size: 12px; font-weight: 700; text-align: center; display: flex; gap: 5px; align-items: center; justify-content: center; }
.vblock { position: absolute; left: 3px; right: 3px; border-radius: 6px; background: var(--c); border: 0; padding: 2px 6px; text-align: left; overflow: hidden; display: block; box-shadow: 0 0 0 1px var(--surface); }
.vblock.planned { background: repeating-linear-gradient(135deg, var(--c) 0 7px, color-mix(in srgb, var(--c) 72%, var(--surface)) 7px 10px); }
.vblock span { font-size: 11.5px; font-weight: 700; color: var(--ink2, #111); line-height: 1.2; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* lists & tables */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); min-height: 48px; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.li .val { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
button.li { background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 6px 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th.n, td.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 800; border-top: 2px solid var(--line); }
.stack { display: flex; height: 16px; border-radius: 6px; overflow: hidden; background: var(--unalloc); }
.stack i { height: 100%; box-shadow: 1px 0 0 var(--surface); }

/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.tip { min-height: 40px; font-size: 13.5px; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-variant-numeric: tabular-nums; }
.legend-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; font-weight: 600; align-items: center; }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.hbar { display: grid; gap: 4px; padding: 6px 0; }
.hbar .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.hbar .top b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.hbar .tracks { display: grid; gap: 3px; }
.hbar .tr { height: 10px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.hbar .tr i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.hbar .tr i.p { background: repeating-linear-gradient(135deg, var(--c) 0 4px, transparent 4px 6px); box-shadow: inset 0 0 0 1px var(--c); }

/* misc */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(136px + env(safe-area-inset-bottom, 0px)); z-index: 200; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 14.5px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .h { font-size: 11px; font-weight: 700; text-align: center; color: var(--muted); }
.cal button { aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-weight: 700; font-variant-numeric: tabular-nums; min-height: 40px; }
.cal button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cal button.src { outline: 2px dashed var(--accent); outline-offset: -4px; }
.cal button[disabled] { opacity: .35; }
.datelist { display: flex; flex-wrap: wrap; gap: 5px; }
.datelist span { font-size: 13px; padding: 3px 8px; border-radius: 8px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.datelist span.c { background: var(--warn-soft); color: var(--warn); font-weight: 700; }
.conf { font-size: 14px; border-left: 3px solid var(--warn); padding: 4px 0 4px 10px; }
.prose p { margin: 0 0 8px; }
.prose p:last-child { margin: 0; }
.prose { font-size: 14.5px; }
details summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; }
code { font-size: 13px; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
@media (min-width: 700px) { :root { --hourw: 40px; --datew: 76px; } }

/* pay periods */
.pay-meta { display: grid; gap: 2px; font-size: 14px; }
.pay-meta span:last-child { color: var(--muted); font-size: 13px; }
.pjobs { display: grid; gap: 8px; }
.pjob { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.pjob-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 15px; }
.pjob-top .num { font-weight: 700; white-space: nowrap; }
.pjob-money { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 14px; font-variant-numeric: tabular-nums; }
.pjob-money span { display: inline-flex; align-items: center; gap: 6px; }
.pjob-status { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.pstat { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.pstat.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pstat.warn { background: var(--warn-soft); color: var(--warn); }
.btn.small-btn { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ptable td, .ptable th { font-size: 13.5px; padding: 7px 5px; }
.ptable tr.now td { background: var(--accent-soft); }
.mper { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
.seg button { overflow-wrap: anywhere; }

</style>
</head>
<body>
<header class="topbar"><div class="topbar-in"><span class="brand">Time <b>&amp;</b> Earn</span><span class="spacer"></span><span class="demo-pill" id="demoPill" hidden>Demo data</span></div></header>
<main id="main" aria-live="polite"><section class="card empty"><h2>Loading your schedule…</h2></section></main>
<button class="fab" id="fab" data-act="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add activity</button>
<nav class="tabbar" aria-label="Main"><div class="tabbar-in">
  <button class="tab" data-act="tab" data-tab="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
  <button class="tab" data-act="tab" data-tab="planner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h8"/></svg>Planner</button>
  <button class="tab" data-act="tab" data-tab="summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Summary</button>
  <button class="tab" data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</button>
</div></nav>
<script>
/* Time & Earn — calculation core (pure functions, no DOM).
   All activity times are local wall-clock times. Dates are 'YYYY-MM-DD' strings
   handled with UTC arithmetic only, so no timezone can shift a date. */
(function (root) {
  'use strict';
  const DAY = 1440;
  const pad = (n) => String(n).padStart(2, '0');

  // ---------- dates ----------
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  function isValidDate(s) {
    if (typeof s !== 'string' || !DATE_RE.test(s)) return false;
    const [y, m, d] = s.split('-').map(Number);
    return m >= 1 && m <= 12 && d >= 1 && d <= daysInMonth(y, m);
  }
  function dayNum(s) {
    const [y, m, d] = s.split('-').map(Number);
    return Math.round(Date.UTC(y, m - 1, d) / 86400000);
  }
  function fromDayNum(n) {
    const dt = new Date(n * 86400000);
    return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate());
  }
  const addDays = (s, k) => fromDayNum(dayNum(s) + k);
  function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); } // m = 1..12
  const isLeapYear = (y) => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  const weekday = (s) => new Date(dayNum(s) * 86400000).getUTCDay(); // 0 = Sunday
  const monthKey = (s) => s.slice(0, 7);
  function monthDates(y, m) {
    const out = [];
    for (let d = 1; d <= daysInMonth(y, m); d++) out.push(y + '-' + pad(m) + '-' + pad(d));
    return out;
  }
  function dateRange(from, to) {
    const out = [];
    for (let n = dayNum(from); n <= dayNum(to); n++) out.push(fromDayNum(n));
    return out;
  }
  function localToday(now) {
    now = now || new Date();
    return now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  }

  // ---------- times ----------
  function parseTime(t) {
    if (typeof t !== 'string' || !/^\d{1,2}:\d{2}$/.test(t)) return NaN;
    const [h, m] = t.split(':').map(Number);
    if (h > 23 || m > 59) return NaN;
    return h * 60 + m;
  }
  const fmtTime = (min) => { min = ((min % DAY) + DAY) % DAY; return pad(Math.floor(min / 60)) + ':' + pad(min % 60); };
  function fmtDur(min) {
    min = Math.round(min);
    const h = Math.floor(min / 60), m = min % 60;
    return h + 'h ' + pad(m) + 'm';
  }
  const hours = (min) => min / 60;

  /** Record span in minutes from midnight of record.date. End may exceed 1440 (next day). */
  function span(r) {
    const s = parseTime(r.start);
    let e = parseTime(r.end);
    if (r.endsNextDay) e += DAY;
    return { s, e };
  }
  /** Convert a time inside the shift to minutes relative to record.date midnight. */
  function toShiftAbs(t, s) { return t >= s ? t : t + DAY; }
  function subInterval(it, s) {
    const a = toShiftAbs(parseTime(it.start), s);
    let b = toShiftAbs(parseTime(it.end), s);
    if (b <= a) b += DAY;
    return [a, b];
  }

  // ---------- validation ----------
  /** Returns list of {field, msg}. Empty list = valid. Does not check overlaps. */
  function validateRecord(r) {
    const errs = [];
    if (r.mode !== 'planned' && r.mode !== 'actual') errs.push({ field: 'mode', msg: 'Choose Planned or Actual.' });
    if (!isValidDate(r.date)) errs.push({ field: 'date', msg: 'Enter a valid date.' });
    const s = parseTime(r.start), eRaw = parseTime(r.end);
    if (isNaN(s)) errs.push({ field: 'start', msg: 'Enter a start time.' });
    if (isNaN(eRaw)) errs.push({ field: 'end', msg: 'Enter an end time.' });
    if (!r.categoryId) errs.push({ field: 'category', msg: 'Choose a category.' });
    if (errs.length) return errs;
    const { e } = span(r);
    if (e <= s) {
      errs.push({ field: 'end', msg: r.endsNextDay ? 'End time is invalid.' : 'The end time is before the start. If this finishes after midnight, turn on "Ends the following day".' });
      return errs;
    }
    if (e - s > DAY) errs.push({ field: 'end', msg: 'An activity can last at most 24 hours.' });
    if (r.paid) {
      if (!(typeof r.rate === 'number' && isFinite(r.rate) && r.rate >= 0)) errs.push({ field: 'rate', msg: 'Enter an hourly rate of 0 or more.' });
    }
    const checkList = (list, field, label) => {
      const ivs = [];
      (list || []).forEach((it, i) => {
        const a = parseTime(it.start), b = parseTime(it.end);
        if (isNaN(a) || isNaN(b)) { errs.push({ field, msg: label + ' ' + (i + 1) + ' needs a start and end time.' }); return; }
        const iv = subInterval(it, s);
        if (iv[0] < s || iv[1] > e || iv[1] - iv[0] > e - s) { errs.push({ field, msg: label + ' ' + (i + 1) + ' (' + it.start + '–' + it.end + ') must be inside the shift.' }); return; }
        if (field === 'segments' && !(typeof it.rate === 'number' && isFinite(it.rate) && it.rate >= 0)) errs.push({ field, msg: label + ' ' + (i + 1) + ' needs a rate.' });
        ivs.push(iv.concat(i));
      });
      ivs.sort((x, y) => x[0] - y[0]);
      for (let k = 1; k < ivs.length; k++) if (ivs[k][0] < ivs[k - 1][1]) errs.push({ field, msg: label + 's ' + (ivs[k - 1][2] + 1) + ' and ' + (ivs[k][2] + 1) + ' overlap.' });
    };
    if (r.paid) {
      checkList(r.breaks, 'breaks', 'Break');
      checkList(r.segments, 'segments', 'Rate period');
    }
    if (r.paidOverrideMin != null && r.paidOverrideMin !== '') {
      const o = r.paidOverrideMin;
      if (!(typeof o === 'number' && o >= 0 && o <= DAY + 60)) errs.push({ field: 'override', msg: 'Paid time override must be between 0 and 25 hours.' });
    }
    return errs;
  }

  // ---------- earnings ----------
  /** Paid pieces of a record: [{a, b, rate}] in minutes relative to record.date. */
  function paidPieces(r) {
    if (!r.paid) return [];
    const { s, e } = span(r);
    let pieces = [[s, e]];
    for (const br of r.breaks || []) {
      const [ba, bb] = subInterval(br, s);
      const next = [];
      for (const [a, b] of pieces) {
        if (bb <= a || ba >= b) { next.push([a, b]); continue; }
        if (ba > a) next.push([a, ba]);
        if (bb < b) next.push([bb, b]);
      }
      pieces = next;
    }
    const segs = (r.segments || []).map((g) => { const [a, b] = subInterval(g, s); return { a, b, rate: g.rate }; }).sort((x, y) => x.a - y.a);
    const out = [];
    for (const [a, b] of pieces) {
      // cut by segment boundaries
      const cuts = new Set([a, b]);
      for (const g of segs) { if (g.a > a && g.a < b) cuts.add(g.a); if (g.b > a && g.b < b) cuts.add(g.b); }
      const pts = [...cuts].sort((x, y) => x - y);
      for (let i = 0; i < pts.length - 1; i++) {
        const mid = (pts[i] + pts[i + 1]) / 2;
        const g = segs.find((q) => mid > q.a && mid < q.b);
        out.push({ a: pts[i], b: pts[i + 1], rate: g ? g.rate : r.rate });
      }
    }
    return out;
  }

  /** Full-record figures. earnings unrounded. */
  function recordTotals(r) {
    const { s, e } = span(r);
    const pcs = paidPieces(r);
    let paidMin = 0, earn = 0;
    for (const p of pcs) { paidMin += p.b - p.a; earn += (p.b - p.a) * p.rate / 60; }
    let factor = 1;
    if (r.paid && r.paidOverrideMin != null && r.paidOverrideMin !== '') {
      if (paidMin > 0) { factor = r.paidOverrideMin / paidMin; earn *= factor; }
      else earn = r.paidOverrideMin * (r.rate || 0) / 60;
      paidMin = r.paidOverrideMin;
    }
    return { totalMin: e - s, paidMin, earnings: earn, breakMin: r.paid ? (r.breaks || []).reduce((t, b) => { const [a, c] = subInterval(b, s); return t + (c - a); }, 0) : 0, factor };
  }

  /** Portion of record that falls on its own date (offset 0) or the next date (offset 1). */
  function portion(r, offset) {
    const { s, e } = span(r);
    const w0 = offset * DAY, w1 = w0 + DAY;
    const a = Math.max(s, w0), b = Math.min(e, w1);
    const min = Math.max(0, b - a);
    let paidMin = 0, earn = 0;
    for (const p of paidPieces(r)) {
      const pa = Math.max(p.a, w0), pb = Math.min(p.b, w1);
      if (pb > pa) { paidMin += pb - pa; earn += (pb - pa) * p.rate / 60; }
    }
    if (r.paid && r.paidOverrideMin != null && r.paidOverrideMin !== '') {
      const t = recordTotals(r);
      const rawPaid = paidPieces(r).reduce((x, p) => x + p.b - p.a, 0);
      if (rawPaid > 0) { const f = r.paidOverrideMin / rawPaid; paidMin *= f; earn *= f; }
      else { const share = (e - s) > 0 ? min / (e - s) : 0; paidMin = r.paidOverrideMin * share; earn = t.earnings * share; }
    }
    return { min, paidMin, earnings: earn, from: a - w0, to: b - w0 };
  }

  /** Fragments shown on a given date: [{rec, from, to}] from records on date or overflowing from date-1. */
  function fragmentsForDate(records, date) {
    const prev = addDays(date, -1);
    const out = [];
    for (const r of records) {
      if (r.date === date) { const p = portion(r, 0); if (p.min > 0) out.push({ rec: r, from: p.from, to: p.to, part: p, cont: false }); }
      else if (r.date === prev) { const p = portion(r, 1); if (p.min > 0) out.push({ rec: r, from: p.from, to: p.to, part: p, cont: true }); }
    }
    return out.sort((x, y) => x.from - y.from);
  }

  // ---------- overlaps ----------
  function absSpan(r) { const { s, e } = span(r); const base = dayNum(r.date) * DAY; return [base + s, base + e]; }
  /** Existing records (same mode) that overlap candidate. */
  function findOverlaps(cand, records, excludeIds) {
    const ex = excludeIds instanceof Set ? excludeIds : new Set(excludeIds || []);
    const [a, b] = absSpan(cand);
    return records.filter((r) => r.mode === cand.mode && r.id !== cand.id && !ex.has(r.id) && (() => { const [c, d] = absSpan(r); return a < d && c < b; })());
  }

  // ---------- aggregation ----------
  function emptyStats() { return { allocated: 0, paidMin: 0, earnings: 0, byCat: {}, byJob: {}, count: 0 }; }
  function dayStats(records, date, mode) {
    const st = emptyStats();
    for (const f of fragmentsForDate(records.filter((r) => r.mode === mode), date)) {
      const r = f.rec, p = f.part;
      st.count++;
      st.allocated += p.min;
      st.byCat[r.categoryId] = (st.byCat[r.categoryId] || 0) + p.min;
      st.paidMin += p.paidMin;
      st.earnings += p.earnings;
      if (r.paid) {
        const k = r.jobId || '_none';
        const j = st.byJob[k] || (st.byJob[k] = { paidMin: 0, earnings: 0 });
        j.paidMin += p.paidMin; j.earnings += p.earnings;
      }
    }
    st.unallocated = Math.max(0, DAY - st.allocated);
    return st;
  }
  function monthStats(records, y, m, mode, sleepCatIds) {
    const dates = monthDates(y, m);
    const days = dates.map((d) => Object.assign({ date: d }, dayStats(records, d, mode)));
    const tot = emptyStats();
    for (const d of days) {
      tot.allocated += d.allocated; tot.paidMin += d.paidMin; tot.earnings += d.earnings; tot.count += d.count;
      for (const k in d.byCat) tot.byCat[k] = (tot.byCat[k] || 0) + d.byCat[k];
      for (const k in d.byJob) { const j = tot.byJob[k] || (tot.byJob[k] = { paidMin: 0, earnings: 0 }); j.paidMin += d.byJob[k].paidMin; j.earnings += d.byJob[k].earnings; }
    }
    const sl = new Set(sleepCatIds || []);
    const sleepDays = days.filter((d) => Object.keys(d.byCat).some((k) => sl.has(k) && d.byCat[k] > 0));
    const sleepTotal = sleepDays.reduce((t, d) => t + Object.keys(d.byCat).filter((k) => sl.has(k)).reduce((x, k) => x + d.byCat[k], 0), 0);
    tot.sleep = { days: sleepDays.map((d) => d.date), totalMin: sleepTotal, avgMin: sleepDays.length ? sleepTotal / sleepDays.length : null };
    return { days, tot };
  }

  // ---------- repeats & batches ----------
  let idCounter = 0;
  function uid(prefix) {
    const r = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2) + (idCounter++));
    return (prefix || '') + r;
  }
  function weekdayDates(from, to, weekdays) {
    const ws = new Set(weekdays);
    return dateRange(from, to).filter((d) => ws.has(weekday(d)));
  }
  function cloneRecord(r, patch) {
    const c = JSON.parse(JSON.stringify(r));
    return Object.assign(c, patch || {});
  }
  /**
   * Plan a batch: candidates to add (and ids they would replace, e.g. series members being edited).
   * Returns {items:[{rec, conflicts:[existing], internal:bool}], conflictCount}.
   */
  function planBatch(adds, existing, replaceIds) {
    const ex = new Set(replaceIds || []);
    const accepted = [];
    const items = adds.map((rec) => {
      const conflicts = findOverlaps(rec, existing, ex);
      const internal = findOverlaps(rec, accepted, []).length > 0;
      if (!internal) accepted.push(rec);
      return { rec, conflicts, internal };
    });
    return { items, replaceIds: [...ex], conflictCount: items.filter((i) => i.conflicts.length || i.internal).length };
  }
  /** Resolve a plan. strategy: 'skip' | 'replace'. Returns {put:[records], del:[ids]} */
  function resolveBatch(plan, strategy) {
    // Excluded ids (records being edited in place) are never deleted here: an edited record
    // keeps its id, so a skipped edit leaves the original untouched.
    const put = [], del = new Set();
    for (const it of plan.items) {
      if (it.internal) continue;
      if (it.conflicts.length) {
        if (strategy !== 'replace') continue;
        it.conflicts.forEach((c) => del.add(c.id));
      }
      put.push(it.rec);
    }
    // a put record keeps its id when editing; don't delete what we're putting
    put.forEach((p) => del.delete(p.id));
    return { put, del: [...del] };
  }
  /** Copy all records of `mode` that start on srcDate to each target date. */
  function copyDayRecords(records, srcDate, mode, targets, toMode) {
    const src = records.filter((r) => r.mode === mode && r.date === srcDate);
    const out = [];
    const seriesFor = {};
    for (const t of targets) {
      if (t === srcDate && (toMode || mode) === mode) continue;
      for (const r of src) {
        const sid = toMode && toMode !== mode ? null : (seriesFor[r.id] || (seriesFor[r.id] = r.seriesId || uid('s_')));
        out.push(cloneRecord(r, { id: uid('a_'), date: t, mode: toMode || mode, seriesId: sid, copiedFrom: r.id, createdAt: Date.now(), updatedAt: Date.now() }));
      }
    }
    return { adds: out, seriesFor };
  }
  /** Repeat the week starting `weekStart` (7 days) onto every date in [from,to] by weekday. */
  function repeatWeek(records, weekStart, mode, from, to) {
    const srcDates = dateRange(weekStart, addDays(weekStart, 6));
    const byWd = {};
    srcDates.forEach((d) => { byWd[weekday(d)] = d; });
    const srcSet = new Set(srcDates);
    const out = [], seriesFor = {};
    for (const t of dateRange(from, to)) {
      if (srcSet.has(t)) continue;
      const sd = byWd[weekday(t)];
      for (const r of records.filter((x) => x.mode === mode && x.date === sd)) {
        const sid = seriesFor[r.id] || (seriesFor[r.id] = r.seriesId || uid('s_'));
        out.push(cloneRecord(r, { id: uid('a_'), date: t, seriesId: sid, copiedFrom: r.id, createdAt: Date.now(), updatedAt: Date.now() }));
      }
    }
    return { adds: out, seriesFor };
  }

  // ---------- DST ----------
  /** Real elapsed minutes between two local wall-clock times (uses the device's timezone rules). */
  function elapsedMinutes(r) {
    const [y, m, d] = r.date.split('-').map(Number);

    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.innerHTML = `<div class="scrim" data-act="closeSheet"></div><section class="sheet ${opts.full ? 'full' : ''}" role="dialog" aria-modal="true"><header class="sheet-head"><h2></h2><button class="icon-btn" data-act="closeSheet" aria-label="Close">${ICON.close}</button></header><div class="sheet-body"></div></section>`;
    document.body.appendChild(wrap);
    const sh = Object.assign({ wrap, body: $('.sheet-body', wrap), state: {} }, opts);
    sh.setTitle = (t) => { $('.sheet-head h2', wrap).textContent = t; $('.sheet', wrap).setAttribute('aria-label', t); };
    sh.setTitle(opts.title || '');
    sheets.push(sh);
    document.body.classList.add('locked');
    sh.render(sh);
    return sh;
  }
  function closeSheet(sh) {
    sh = sh || sheets[sheets.length - 1];
    if (!sh) return;
    const i = sheets.indexOf(sh);
    if (i >= 0) sheets.splice(i, 1);
    sh.wrap.remove();
    if (sh.onClose) sh.onClose();
    if (!sheets.length) document.body.classList.remove('locked');
  }
  const topSheet = () => sheets[sheets.length - 1];
  function refreshLiveSheets() { sheets.forEach((s) => { if (s.live) { const st = s.body.scrollTop; s.render(s); s.body.scrollTop = st; } }); }
  /** In-page confirmation. buttons: [{label, val, kind}] → resolves val or null */
  function choose(title, html, buttons) {
    return new Promise((resolve) => {
      let done = false;
      openSheet({
        title,
        onClose: () => { if (!done) resolve(null); },
        render(sh) {
          sh.body.innerHTML = `<div class="prose">${html}</div><div class="btn-row" style="flex-direction:column">${buttons.map((b, i) => `<button class="btn block ${b.kind || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>`;
          $$('[data-i]', sh.body).forEach((btn) => btn.addEventListener('click', () => { done = true; closeSheet(sh); resolve(buttons[+btn.dataset.i].val); }));
        }
      });
    });
  }

  // ---------------- rendering: shell ----------------
  function renderAll() {
    applyTheme();
    renderShell();
    renderTab();
    refreshLiveSheets();
  }
  function renderShell() {
    $('#demoPill').hidden = !S.demoOn;
    $$('.tab').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === S.ui.tab ? 'page' : 'false'));
    $('#fab').hidden = S.ui.tab === 'settings';
  }
  function renderTab() {
    const main = $('#main');
    const banners = storageBanner() + (S.demoOn ? `<div class="banner warn" role="note"><div style="flex:1;min-width:200px"><strong>Demo data.</strong> These sample records are not your own, are not saved, and are never added to your totals.</div><button class="btn" data-act="demoOff">Return to my data</button></div>` : '');
    const views = { dashboard: viewDashboard, planner: viewPlanner, summary: viewSummary, settings: viewSettings };
    main.innerHTML = banners + views[S.ui.tab]();
    if (S.ui.tab === 'planner') afterPlanner();
    if (S.ui.tab === 'summary') afterSummary();
  }
  function storageBanner() {
    if (S.storage === 'memory') return `<div class="banner err" role="alert"><div><strong>Not saving.</strong> This browser is blocking on-device storage (for example a private window), so anything you add will be lost when you close the page. Use a normal browser window, or export a backup from Settings before leaving.</div></div>`;
    return '';
  }

  // ---------------- mode toggle ----------------
  function modeSeg(mode, act) {
    return `<div class="seg mode" role="group" aria-label="Schedule">
      <button data-act="${act}" data-val="planned" aria-pressed="${mode === 'planned'}">Planned</button>
      <button data-act="${act}" data-val="actual" aria-pressed="${mode === 'actual'}">Actual</button></div>`;
  }
  const modeHint = (mode) => mode === 'planned' ? 'Planned: your schedule and expected earnings.' : 'Actual: what you really did and recorded earnings.';

  // ---------------- dashboard ----------------
  function viewDashboard() {
    const d = D(), td = today(), y = +td.slice(0, 4), m = +td.slice(5, 7);
    if (!d.activities.length) {
      return `<section class="card empty"><div class="eyebrow">${esc(niceDate(td, true))}</div><h2>Plan your first day</h2><p>Add a shift, your sleep or your commute. Time & Earn works out your hours and gross earnings as you go.</p>
        <div class="btn-row" style="justify-content:center"><button class="btn primary" data-act="add">Add activity</button>${S.demoOn ? '' : '<button class="btn" data-act="demoOn">Try demo data</button>'}</div></section>` + incomeSection(y, m);
    }
    const P = T.dayStats(d.activities, td, 'planned'), A = T.dayStats(d.activities, td, 'actual');
    return `<section class="card">
      <div class="card-head"><div><div class="eyebrow">Today</div><h2>${esc(niceDate(td, true))}</h2></div><button class="btn" data-act="openDay" data-date="${td}">Open day</button></div>
      <div class="pair">
        <div><span class="label"><i class="key plan"></i>Planned</span><span class="big money">${money(P.earnings)}</span><span class="sub">${hrs(P.paidMin)} paid · expected</span></div>
        <div><span class="label"><i class="key act"></i>Actual</span><span class="big money">${money(A.earnings)}</span><span class="sub">${hrs(A.paidMin)} paid · recorded</span></div>
      </div>
      <div class="gross-note">Gross earnings before tax and deductions.</div>
    </section>` + incomeSection(y, m) + dashTimeCard(td, y, m);
  }
  function dashMonthCard(y, m) {
    const d = D();
    const P = T.monthStats(d.activities, y, m, 'planned', []).tot, A = T.monthStats(d.activities, y, m, 'actual', []).tot;
    const pct = P.earnings > 0 ? Math.min(100, (A.earnings / P.earnings) * 100) : 0;
    return `<section class="card">
      <div class="card-head"><div><div class="eyebrow">This month</div><h2>${MON[m - 1]} ${y}</h2></div><button class="btn" data-act="goSummary">Summary</button></div>
      <div class="pair">
        <div><span class="label"><i class="key plan"></i>Expected</span><span class="big money">${money(P.earnings)}</span><span class="sub">${hrs(P.paidMin)} paid planned</span></div>
        <div><span class="label"><i class="key act"></i>Recorded</span><span class="big money">${money(A.earnings)}</span><span class="sub">${hrs(A.paidMin)} paid so far</span></div>
      </div>
      ${P.earnings > 0 ? `<div><div class="meter" role="img" aria-label="Recorded is ${Math.round(pct)}% of expected"><i style="width:${pct}%"></i></div><small>${Math.round(pct)}% of expected earnings recorded</small></div>` : ''}
      <div class="gross-note">Gross earnings before tax and deductions. Totals update as soon as you edit.</div>
    </section>`;
  }
  const DASH_ROLES = [['work', 'Work'], ['sleep', 'Sleep'], ['travel', 'Travel'], ['learning', 'Learning'], ['exercise', 'Exercise'], ['leisure', 'Leisure']];
  function dashTimeCard(td, y, m) {
    const d = D();
    const range = S.ui.dashRange;
    let byCat = {}, totalWindow = 1440, allocated = 0, caption;
    if (range === 'today') {
      const st = T.dayStats(d.activities, td, 'actual'); byCat = st.byCat; allocated = st.allocated; caption = 'Recorded today';
    } else {
      const ms = T.monthStats(d.activities, y, m, 'actual', []);
      byCat = ms.tot.byCat; allocated = ms.tot.allocated;
      const elapsed = +td.slice(8, 10);
      totalWindow = elapsed * 1440;
      caption = `Recorded 1–${elapsed} ${MON[m - 1]} (${elapsed} day${elapsed > 1 ? 's' : ''} so far)`;
    }
    const roleMin = (role) => catIdsByRole(role).reduce((t, id) => t + (byCat[id] || 0), 0);
    const known = new Set(DASH_ROLES.flatMap(([r]) => catIdsByRole(r)));
    const other = Object.keys(byCat).filter((k) => !known.has(k)).reduce((t, k) => t + byCat[k], 0);
    const unalloc = Math.max(0, totalWindow - allocated);
    const rows = DASH_ROLES.map(([r, label]) => {
      const c = d.categories.find((x) => x.role === r) || { color: '#888888', short: '', name: label };
      return { label: c.name || label, min: roleMin(r), c };
    });
    rows.push({ label: 'Other activities', min: other, c: { color: '#8a9690', short: '··', name: 'Other' } });
    const stack = Object.keys(byCat).map((k) => `<i style="width:${(byCat[k] / totalWindow) * 100}%;background:${esc(cat(k).color)}" title="${esc(cat(k).name)}"></i>`).join('');
    return `<section class="card">
      <div class="card-head"><div><div class="eyebrow">Actual time</div><h2>${range === 'today' ? 'How today went' : 'This month so far'}</h2></div></div>
      <div class="seg" role="group" aria-label="Range"><button data-act="dashRange" data-val="today" aria-pressed="${range === 'today'}">Today</button><button data-act="dashRange" data-val="month" aria-pressed="${range === 'month'}">This month</button></div>
      <div class="stack" role="img" aria-label="Time split">${stack}</div>
      <div class="list">${rows.map((r) => `<div class="li">${sw(r.c)}<span class="grow">${esc(r.label)}</span><span class="val">${dur(r.min)}</span></div>`).join('')}
        <div class="li"><span class="sw un">–</span><span class="grow">Unallocated<br><small>Time with nothing recorded. It is never counted as sleep.</small></span><span class="val">${dur(unalloc)}</span></div></div>
      <small>${esc(caption)}.</small>
    </section>`;
  }

  // ---------------- planner ----------------
  function viewPlanner() {
    const { y, m, mode } = S.ui, d = D();
    const days = T.daysInMonth(y, m);
    const td = today();
    const recs = d.activities.filter((r) => r.mode === mode);
    const ms = T.monthStats(d.activities, y, m, mode, []);
    let hours = '';
    for (let h = 0; h < 24; h++) hours += `<span>${T.pad(h)}</span>`;
    const rows = ms.days.map((ds) => {
      const date = ds.date, wd = T.weekday(date);
      const bars = T.fragmentsForDate(recs, date).map((f) => {
        const c = cat(f.rec.categoryId);
        const left = (f.from / 1440) * 100, width = ((f.to - f.from) / 1440) * 100;
        const pxw = (f.to - f.from) / 60 * 34;
        return `<i class="bar ${mode}" style="left:${left}%;width:${width}%;--c:${esc(c.color)};--ink2:${inkFor(c.color)}" title="${esc(c.name)} ${esc(timeRange(f.rec))}">${pxw >= 20 ? `<em>${esc(pxw >= 90 ? (f.rec.name || c.name) : (c.short || ''))}</em>` : ''}</i>`;
      }).join('');
      const label = ds.earnings > 0 ? money(ds.earnings) : (ds.count ? dur(ds.allocated) : '');
      return `<button class="tl-row ${date === td ? 'today' : ''} ${wd === 0 || wd === 6 ? 'weekend' : ''}" data-act="openDay" data-date="${date}" id="row-${date}" aria-label="${esc(niceDate(date, true))}${date === td ? ', today' : ''}. ${ds.count} activities${ds.earnings ? ', ' + money(ds.earnings) : ''}">
        <span class="tl-date"><span class="wd">${WD[wd]}</span><span class="dn">${+date.slice(8)}</span><span class="de">${esc(label)}</span></span>
        <span class="tl-track">${bars}</span></button>`;
    }).join('');
    const legend = d.categories.map((c) => `<span class="lg">${sw(c)}${esc(c.name)}</span>`).join('') + `<span class="lg"><span class="sw un">–</span>Unallocated</span>`;
    return `<section class="monthbar">
        <button class="icon-btn" data-act="month" data-val="-1" aria-label="Previous month">${ICON.left}</button>
        <div class="mlabel"><h1>${MON[m - 1]} ${y}</h1><small>${days} days${m === 2 && T.isLeapYear(y) ? ' · leap year' : ''} · tap to pick</small>
          <input type="month" id="monthPick" value="${y}-${T.pad(m)}" aria-label="Choose month and year" data-on="pickMonth"></div>
        <button class="icon-btn" data-act="month" data-val="1" aria-label="Next month">${ICON.right}</button>
      </section>
      <div style="display:grid;gap:6px">${modeSeg(mode, 'mode')}<span class="mode-hint">${modeHint(mode)}${mode === 'planned' ? ' Striped blocks are planned.' : ''}</span></div>
      <div class="btn-row"><button class="btn" data-act="today">Today</button><button class="btn" data-act="tools">Repeat &amp; copy</button></div>
      <div class="legend" aria-label="Colour key">${legend}</div>
      <section class="tl-wrap">
        <div class="tl" id="tl"><div class="tl-grid">
          <div class="tl-head"><div class="tl-corner">Date</div><div class="tl-hours">${hours}</div></div>
          ${rows}
        </div></div>
        <div class="tl-foot"><span>${mode === 'planned' ? 'Expected' : 'Recorded'} this month: <b class="money">${money(ms.tot.earnings)}</b></span><span>${hrs(ms.tot.paidMin)} paid</span></div>
      </section>
      <small class="gross-note">Gross earnings before tax and deductions. Scroll sideways to see all 24 hours; tap a date to open that day.</small>`;
  }
  let scrolledFor = '';
  function afterPlanner() {
    const tl = $('#tl'); if (!tl) return;
    const key = S.ui.y + '-' + S.ui.m;
    if (scrolledFor !== key) {
      scrolledFor = key;
      const row = $('#row-' + today());
      tl.scrollLeft = 6 * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hourw') || 34);
      if (row) tl.scrollTop = Math.max(0, row.offsetTop - 80);
    } else if (S.ui.tlScroll) { tl.scrollLeft = S.ui.tlScroll[0]; tl.scrollTop = S.ui.tlScroll[1]; }
    tl.addEventListener('scroll', () => { S.ui.tlScroll = [tl.scrollLeft, tl.scrollTop]; }, { passive: true });
  }

  // ---------------- day view ----------------
  function openDay(date) {
    openSheet({
      full: true, live: true, title: niceDate(date, true), state: { date, mode: S.ui.mode },
      render: renderDay
    });
  }
  function renderDay(sh) {
    const { date, mode } = sh.state;
    const d = D();
    sh.setTitle(niceDate(date, true) + (date === today() ? ' · Today' : ''));
    const P = T.dayStats(d.activities, date, 'planned'), A = T.dayStats(d.activities, date, 'actual');
    const frags = T.fragmentsForDate(d.activities.filter((r) => r.mode === mode), date);
    const hasPlanned = d.activities.some((r) => r.mode === 'planned' && r.date === date);
    const list = frags.length ? frags.map((f) => {
      const r = f.rec, c = cat(r.categoryId);
      const tot = T.recordTotals(r);
      const piece = f.part;
      const split = r.endsNextDay && T.span(r).e > 1440;
      return `<button class="aitem ${f.cont ? 'cont' : ''}" data-act="edit" data-id="${esc(r.id)}">${sw(c)}
        <span style="min-width:0"><span class="nm">${esc(r.name || c.name)}</span><br><span class="tm">${esc(timeRange(r))} · ${dur(tot.totalMin)}${f.cont ? ' · continues from ' + esc(niceDate(r.date)) : ''}${r.paid && (r.breaks || []).length ? ' · ' + dur(tot.breakMin) + ' unpaid break' : ''}${r.seriesId ? ' · repeats' : ''}</span>
        ${r.paid && job(r.jobId) ? `<br><span class="tm">${esc(job(r.jobId).name)}</span>` : ''}</span>
        <span class="rt">${r.paid ? money(split ? piece.earnings : tot.earnings) + `<small>${split ? 'on this date' : money(r.rate) + '/h'}</small>` : '<small>Unpaid</small>'}</span></button>`;
    }).join('') : `<div class="card empty" style="padding:20px"><p>No ${mode} activities on this day.</p></div>`;

    let hoursCol = '';
    for (let h = 0; h <= 24; h += 2) hoursCol += `<span style="top:${(h / 24) * 100}%">${T.pad(h % 24)}:00</span>`;
    const col = (md) => T.fragmentsForDate(d.activities.filter((r) => r.mode === md), date).map((f) => {
      const c = cat(f.rec.categoryId), top = (f.from / 1440) * 100, h = ((f.to - f.from) / 1440) * 100, px = (f.to - f.from) / 2;
      return `<button class="vblock ${md}" style="top:${top}%;height:${h}%;--c:${esc(c.color)};--ink2:${inkFor(c.color)}" data-act="edit" data-id="${esc(f.rec.id)}" aria-label="${esc((f.rec.name || c.name) + ' ' + timeRange(f.rec))}">${px >= 13 ? `<span>${esc(f.rec.name || c.name)}</span>` : ''}${px >= 28 ? `<span>${esc(T.fmtTime(f.from))}–${esc(f.to === 1440 ? '24:00' : T.fmtTime(f.to))}</span>` : ''}</button>`;
    }).join('');

    sh.body.innerHTML = `
      <div class="daynav"><button class="icon-btn" data-act="dayNav" data-val="-1" aria-label="Previous day">${ICON.left}</button><span class="dt">${esc(niceDate(date))}</span><button class="icon-btn" data-act="dayNav" data-val="1" aria-label="Next day">${ICON.right}</button></div>
      <div class="totals3">
        <div><span class="t"><i class="key plan"></i>Planned</span><span class="v money">${money(P.earnings)}</span><span class="s">${hrs(P.paidMin)} paid</span></div>
        <div><span class="t"><i class="key act"></i>Actual</span><span class="v money">${money(A.earnings)}</span><span class="s">${hrs(A.paidMin)} paid</span></div>
        <div><span class="t">Unallocated</span><span class="v">${dur(A.unallocated)}</span><span class="s">actual · plan ${dur(P.unallocated)}</span></div>
      </div>
      <small class="gross-note">Gross earnings before tax and deductions.</small>
      <div style="display:grid;gap:6px">${modeSeg(mode, 'dayMode')}<span class="mode-hint">${modeHint(mode)}</span></div>
      <div class="btn-row">
        <button class="btn primary" data-act="add" data-date="${date}" data-mode="${mode}">${ICON.plus.replace('<svg', '<svg width="18" height="18"')} Add ${mode}</button>
        ${mode === 'actual' ? `<button class="btn" data-act="copyToActual" data-date="${date}" ${hasPlanned ? '' : 'disabled'}>Copy planned to actual</button>` : ''}
        <button class="btn" data-act="copyDay" data-date="${date}">Copy day to…</button>
      </div>
      <div class="alist">${list}</div>
      <h3 style="font-size:16px">Timeline</h3>
      <div class="vt" aria-label="Planned and actual timeline">
        <span></span><span class="vt-head"><i class="key plan"></i>Planned</span><span class="vt-head"><i class="key act"></i>Actual</span>
        <div class="vt-hours">${hoursCol}</div><div class="vt-col">${col('planned')}</div><div class="vt-col">${col('actual')}</div>
      </div>`;
  }

  // ---------------- activity editor ----------------
  function newState(date, mode, catId) {
    const c = catId ? cat(catId) : D().categories.find((x) => x.role === 'work') || D().categories[0];
    const firstJob = D().jobs[0];
    return {
      isNew: true, id: T.uid('a_'), mode: mode || S.ui.mode, date: date || today(), categoryId: c ? c.id : '', name: '',
      start: '09:00', end: '17:00', endsNextDay: false, paid: !!(c && c.role === 'work'),
      jobId: c && c.role === 'work' && firstJob ? firstJob.id : '', rate: c && c.role === 'work' && firstJob ? firstJob.rate : '',
      breaks: [], segments: [], notes: '', override: '', repeat: false, weekdays: [T.weekday(date || today())], until: '', errors: [], touchedRate: false
    };
  }
  function stateFromRecord(r) {
    return {
      isNew: false, id: r.id, mode: r.mode, date: r.date, categoryId: r.categoryId, name: r.name || '', start: r.start, end: r.end,
      endsNextDay: !!r.endsNextDay, paid: !!r.paid, jobId: r.jobId || '', rate: r.paid ? r.rate : '', breaks: JSON.parse(JSON.stringify(r.breaks || [])),
      segments: JSON.parse(JSON.stringify(r.segments || [])), notes: r.notes || '', override: r.paidOverrideMin != null ? String(r.paidOverrideMin / 60) : '',
      seriesId: r.seriesId || null, createdAt: r.createdAt, orig: r, errors: [], touchedRate: true
    };
  }
  function openEditor(state) {
    openSheet({ title: state.isNew ? 'Add activity' : 'Edit activity', state, render: renderEditor });
  }
  function catOptions(sel) { return D().categories.map((c) => `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${esc(c.short ? c.short + ' · ' : '')}${esc(c.name)}</option>`).join(''); }
  function renderEditor(sh) {
    const s = sh.state, d = D();
    const errs = s.errors || [];
    const bad = (f) => errs.some((e) => e.field === f) ? 'invalid' : '';
    const jobsOpt = `<option value="">No job</option>` + d.jobs.map((j) => `<option value="${esc(j.id)}" ${j.id === s.jobId ? 'selected' : ''}>${esc(j.name)} · ${money(j.rate)}/h</option>`).join('');
    const ivRows = (list, kind) => list.map((it, i) => `<div class="row3">
        <div class="field"><label for="f-${kind}s-${i}">From</label><input type="time" id="f-${kind}s-${i}" value="${esc(it.start)}"></div>
        <div class="field"><label for="f-${kind}e-${i}">To</label><input type="time" id="f-${kind}e-${i}" value="${esc(it.end)}"></div>
        <button class="icon-btn" data-act="rmIv" data-kind="${kind}" data-i="${i}" aria-label="Remove">${ICON.close}</button>
        ${kind === 'g' ? `<div class="field" style="grid-column:1/3"><label for="f-gr-${i}">Rate for this period (${esc(curSymbol())}/h)</label><input type="number" inputmode="decimal" step="0.01" min="0" id="f-gr-${i}" value="${esc(it.rate)}"></div>` : ''}
      </div>`).join('');
    const isSeries = !s.isNew && s.seriesId;
    sh.body.innerHTML = `
      ${errs.length ? `<div class="errors" role="alert"><strong>Please fix ${errs.length === 1 ? 'this' : 'these'}:</strong><ul>${errs.map((e) => `<li>${esc(e.msg)}</li>`).join('')}</ul></div>` : ''}
      ${S.demoOn ? '<div class="banner warn">You are editing demo data. Changes are not saved.</div>' : ''}
      <div class="field"><span class="lbl">Record as</span>${modeSeg(s.mode, 'fMode')}<span class="hint">${modeHint(s.mode)}</span></div>
      <div class="field"><label for="f-cat">Category</label><select id="f-cat" class="${bad('category')}">${catOptions(s.categoryId)}</select></div>
      <div class="field"><label for="f-name">Activity name <span class="muted">(optional)</span></label><input type="text" id="f-name" value="${esc(s.name)}" placeholder="${esc(cat(s.categoryId).name)}" autocomplete="off" maxlength="60"></div>
      <div class="field"><label for="f-date">Date</label><input type="date" id="f-date" value="${esc(s.date)}" class="${bad('date')}"></div>
      <div class="row2">
        <div class="field"><label for="f-start">Start</label><input type="time" id="f-start" value="${esc(s.start)}" class="${bad('start')}"></div>
        <div class="field"><label for="f-end">End</label><input type="time" id="f-end" value="${esc(s.end)}" class="${bad('end')}"></div>
      </div>
      <label class="switch">Ends the following day<input type="checkbox" id="f-next" ${s.endsNextDay ? 'checked' : ''}></label>
      <label class="switch"><span>Paid work<small>Counts towards earnings</small></span><input type="checkbox" id="f-paid" ${s.paid ? 'checked' : ''}></label>
      ${s.paid ? `<fieldset><legend>Pay</legend>

  async function saveEditor(sh) {

  // ---------------- batch preview ----------------
  /** Shows dates & conflicts; resolves true if applied. */
  function batchPreview(title, plan, descr, isEdit) {
    return new Promise((resolve) => {
      let done = false;
      const items = plan.items;
      const dates = [...new Set(items.map((i) => i.rec.date))].sort();
      const conflictItems = items.filter((i) => i.conflicts.length || i.internal);
      const conflictDates = new Set(conflictItems.map((i) => i.rec.date));
      const replaceCount = new Set(conflictItems.flatMap((i) => i.conflicts.map((c) => c.id))).size;
      const skipAdd = items.filter((i) => !i.conflicts.length && !i.internal).length;
      openSheet({
        title, onClose: () => { if (!done) resolve(false); },
        render(sh) {
          const buttons = [];
          if (!items.length) buttons.push(`<button class="btn block" data-v="cancel">Close</button>`);
          else if (!conflictItems.length) buttons.push(`<button class="btn primary block" data-v="skip">${isEdit ? 'Save' : 'Add'} ${items.length} ${items.length === 1 ? 'activity' : 'activities'}</button>`);
          else {
            buttons.push(`<button class="btn primary block" data-v="skip">Skip clashes · ${isEdit ? 'save' : 'add'} ${skipAdd}</button>`);
            if (conflictItems.some((i) => i.conflicts.length)) buttons.push(`<button class="btn block danger" data-v="replace">Replace · remove ${replaceCount} existing</button>`);
          }
          if (items.length) buttons.push(`<button class="btn ghost block" data-v="cancel">Cancel</button>`);
          sh.body.innerHTML = `${descr ? `<p class="prose" style="margin:0">${descr}</p>` : ''}
            ${S.demoOn ? '<div class="banner warn">Demo data: changes are not saved.</div>' : ''}
            <div><div class="eyebrow">${items.length} ${items.length === 1 ? 'activity' : 'activities'} on ${dates.length} date${dates.length === 1 ? '' : 's'}</div></div>
            <div class="datelist">${dates.map((d) => `<span class="${conflictDates.has(d) ? 'c' : ''}">${esc(niceDate(d))}${conflictDates.has(d) ? ' · clash' : ''}</span>`).join('') || '<span>No dates match.</span>'}</div>
            ${conflictItems.length ? `<div class="banner warn" role="alert"><div><strong>${conflictItems.length} clash${conflictItems.length === 1 ? '' : 'es'} found.</strong> Nothing has been changed yet. Choose whether to skip these dates or replace what's already there.</div></div>
              <div style="display:grid;gap:6px">${conflictItems.slice(0, 40).map((i) => `<div class="conf"><b>${esc(niceDate(i.rec.date))}</b> ${esc(timeRange(i.rec))}: ${i.internal ? 'overlaps another activity in this same batch (it will be skipped)' : 'overlaps ' + conflictText(i.conflicts)}</div>`).join('')}${conflictItems.length > 40 ? `<small>…and ${conflictItems.length - 40} more.</small>` : ''}</div>` : ''}
            <div style="display:grid;gap:8px">${buttons.join('')}</div>`;
          $$('[data-v]', sh.body).forEach((b) => b.addEventListener('click', () => {
            const v = b.dataset.v;
            done = true; closeSheet(sh);
            if (v === 'cancel') { resolve(false); return; }
            const res = T.resolveBatch(plan, v);
            if (!res.put.length && !res.del.length) { toast('Nothing to change'); resolve(true); return; }

            resolve(true);
          }));
        }
      });
    });
  }

  // ---------------- pay cycles ----------------

  }

  const ordinal = (n) => n + ((n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'));
  function cycleText(cyc) {
    const c = T.normCycle(cyc);
    if (c.type === 'manual') return `${c.periods.length} set pay period${c.periods.length === 1 ? '' : 's'}`;
    const span = c.startDay === 1 ? 'Calendar month' : `${ordinal(c.startDay)} to the ${ordinal(c.startDay - 1)}`;
    const pay = c.paydayMonth === 'none' ? 'payday not set' : `paid on the ${ordinal(c.paydayDay)} of ${c.paydayMonth === 'closing' ? 'the closing month' : 'the following month'}`;
    return span + ', ' + pay;
  }

  }
  function groupMatcher(g) {

  }

  const periodDays = (per) => T.dayNum(per.end) - T.dayNum(per.start) + 1;

  function payStatus(jid, per) {
    const rec = (D().payments.records || {})[payKey(jid, per)], td = today();

    if (!per.payday) return { cls: '', text: td > per.end ? 'Not marked as received' : (td >= per.start ? 'Period in progress' : 'Upcoming period') };

  function payPeriodCard(g, per, opts) {

  function buildPeriodCSV(g, per) {

      .sort((a, b) => (a.mode + a.date + a.start).localeCompare(b.mode + b.date + b.start));

        <div class="mlabel"><h1>${MON[m - 1]} ${y}</h1><small>Monthly summary · tap to pick</small><input type="month" id="sumPick" value="${y}-${T.pad(m)}" aria-label="Choose month and year" data-on="pickSum"></div>

  async function offerFile(filename, text, label) {
    if (window.claude) {
      // Inside the Claude app: use its download capability.
      await Promise.race([dlReady, new Promise((r) => setTimeout(r, 1500))]);
      if (dlCap) {
        try { await dlCap.save({ filename, data: text }); toast('File ready: ' + filename); return; }
        catch (e) { if (e && e.code === 'declined') { toast('Download cancelled'); return; } if (e && e.code === 'rate_limited') { toast('A download is already waiting for you.'); return; } }
      }
      return copySheet(filename, text, label, false);
    }
    const type = filename.endsWith('.csv') ? 'text/csv' : 'application/json';
    // iPhone / iPad (including Home Screen apps): browser downloads are unreliable, so use the Share sheet → "Save to Files".
    if (navigator.maxTouchPoints > 0 && navigator.share && navigator.canShare) {
      let file = new File([text], filename, { type });
      try { if (!navigator.canShare({ files: [file] })) file = new File([text], filename, { type: 'text/plain' }); } catch (e) { /* use as is */ }
      let can = false; try { can = navigator.canShare({ files: [file] }); } catch (e) { can = false; }
      if (can) {
        try { await navigator.share({ files: [file] }); toast('Done. If you chose Save to Files, it is in the Files app.'); return; }
        catch (e) { if (e && e.name === 'AbortError') { toast('Cancelled. Nothing was saved.'); return; } }
        return copySheet(filename, text, label, true);
      }
    }
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
