          <button class="btn" data-jx="addp">Add pay period</button>`;
        sh.body.innerHTML = `<div id="jerr">${state.errors.length ? `<div class="errors" role="alert"><strong>Please fix:</strong><ul>${state.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}</div>
          ${S.demoOn ? '<div class="banner warn">You are editing demo data. Changes are not saved.</div>' : ''}
          <div class="field"><label for="j-name">Job name</label><input type="text" id="j-name" value="${esc(state.name)}" maxlength="50" placeholder="e.g. Nursery, Weekend café"></div>
          <div class="field"><label for="j-rate">Default hourly rate (${esc(curSymbol())})</label><input type="number" inputmode="decimal" step="0.01" min="0" id="j-rate" value="${esc(state.rate)}" placeholder="12.74"><span class="hint">Shifts you've already saved keep their own rate.</span></div>
          <fieldset><legend>Pay cycle</legend>
            <div class="seg" role="group" aria-label="Pay cycle type"><button data-jt="calendar" aria-pressed="${c.type === 'calendar'}">Calendar month</button><button data-jt="monthly" aria-pressed="${c.type === 'monthly'}">Monthly dates</button><button data-jt="manual" aria-pressed="${c.type === 'manual'}">Set dates</button></div>
            ${body}
          </fieldset>
          <div class="field"><span class="lbl">Preview</span><div id="j-prev">${previewHtml()}</div></div>
          <div class="sheet-foot">${j ? `<button class="btn danger" id="j-del">Delete</button>` : ''}<button class="btn primary" id="j-save">Save</button></div>`;
        const rerender = () => { const st = sh.body.scrollTop; sh.render(sh); sh.body.scrollTop = st; };
        sh.body.oninput = () => { readForm(sh); $('#j-prev', sh.body).innerHTML = previewHtml(); };
        sh.body.onchange = (e) => { readForm(sh); if (e.target.id === 'j-pmon') rerender(); else $('#j-prev', sh.body).innerHTML = previewHtml(); };
        $$('[data-jt]', sh.body).forEach((btn) => btn.onclick = () => {
          readForm(sh); c.type = btn.dataset.jt;
          if (c.type === 'manual' && !c.periods.length) {
            const per = T.periodFor({ type: 'monthly', startDay: +c.startDay || 1, paydayDay: +c.paydayDay || 28, paydayMonth: c.paydayMonth }, today());
            c.periods.push({ id: T.uid('pp_'), start: per.start, end: per.end, payday: per.payday || '' });
          }
          rerender();
        });
        $$('[data-jx]', sh.body).forEach((btn) => btn.onclick = () => {
          readForm(sh);
          if (btn.dataset.jx === 'rm') c.periods.splice(+btn.dataset.i, 1);
          else {
            const valid = c.periods.filter((p) => T.isValidDate(p.end)).sort((x, y) => x.end.localeCompare(y.end));
            const start = valid.length ? T.addDays(valid[valid.length - 1].end, 1) : today();
            const [ny, nm] = T.addMonths(+start.slice(0, 4), +start.slice(5, 7), 1);
            c.periods.push({ id: T.uid('pp_'), start, end: T.addDays(T.clampDate(ny, nm, +start.slice(8)), -1), payday: '' });
          }
          rerender();
        });
        $('#j-save', sh.body).onclick = () => {
          readForm(sh);
          const name = state.name.trim(), rate = state.rate;
          const errs = []; if (!name) errs.push('Enter a job name.'); if (rate === '' || isNaN(+rate) || +rate < 0) errs.push('Enter a default hourly rate of 0 or more.');
          const cyc = cycleForSave(); T.validateCycle(cyc).forEach((e) => errs.push(e));
          if (errs.length) { state.errors = errs; rerender(); sh.body.scrollTop = 0; return; }
          const rec = Object.assign({}, j || {}, { id: j ? j.id : T.uid('j_'), name, rate: T.round2(+rate), payCycle: T.normCycle(cyc), updatedAt: Date.now() });
          apply({ jobs: { put: [rec] } }, j ? 'Job updated. Saved shifts keep their rates.' : 'Job added');
          closeSheet(sh);
        };
        if (j) $('#j-del', sh.body).onclick = async () => {
          const v = await choose('Delete job?', `<p>${esc(j.name)} is used by ${used} ${used === 1 ? 'activity' : 'activities'}. ${used ? 'They keep their saved rates and earnings, and will show as “Deleted job”.' : ''}</p>`, [{ label: 'Delete job', val: true, kind: 'danger solid' }, { label: 'Cancel', val: null, kind: 'ghost' }]);
          if (v) { apply({ jobs: { del: [j.id] } }, 'Job deleted'); closeSheet(sh); }
        };
      }
    });
  }
  function editCat(id) {
    const c = id ? cat(id) : null;
    const used = id ? D().activities.filter((r) => r.categoryId === id).length : 0;
    openSheet({
      title: c ? 'Edit category' : 'Add category', render(sh) {
        sh.body.innerHTML = `<div id="cerr"></div>
          <div class="field"><label for="c-name">Name</label><input type="text" id="c-name" value="${esc(c ? c.name : '')}" maxlength="40"></div>
          <div class="row2"><div class="field"><label for="c-short">Short label</label><input type="text" id="c-short" value="${esc(c ? c.short : '')}" maxlength="3" placeholder="1–3 letters"><span class="hint">Shown on timeline blocks.</span></div>
          <div class="field"><label for="c-color">Colour</label><input type="color" id="c-color" value="${esc(c ? c.color : '#5b8def')}"></div></div>
          <div class="field"><label for="c-role">Counts as</label><select id="c-role">${ROLES.map(([r, n]) => `<option value="${r}" ${(c ? c.role || '' : '') === r ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select><span class="hint">Used for the dashboard totals and the sleep average.</span></div>
          <div class="field"><span class="lbl">Preview</span><span class="lg" id="c-prev" style="justify-self:start"></span></div>
          <div class="sheet-foot">${c ? `<button class="btn danger" id="c-del">Delete</button>` : ''}<button class="btn primary" id="c-save">Save</button></div>`;
        const prev = () => { const tmp = { name: $('#c-name', sh.body).value || 'Category', short: $('#c-short', sh.body).value, color: $('#c-color', sh.body).value }; $('#c-prev', sh.body).innerHTML = sw(tmp) + esc(tmp.name); };
        sh.body.oninput = prev; prev();
        $('#c-save', sh.body).onclick = () => {
          const name = $('#c-name', sh.body).value.trim();
          if (!name) { $('#cerr', sh.body).innerHTML = '<div class="errors" role="alert"><strong>Enter a name.</strong></div>'; return; }
          apply({ categories: { put: [{ id: c ? c.id : T.uid('cat_'), name, short: $('#c-short', sh.body).value.trim(), color: $('#c-color', sh.body).value, role: $('#c-role', sh.body).value }] } }, 'Category saved');
          closeSheet(sh);
        };
        if (c) $('#c-del', sh.body).onclick = async () => {
          if (used) { await choose('Category in use', `<p>${esc(c.name)} is used by ${used} ${used === 1 ? 'activity' : 'activities'}. Change or delete those first, or rename this category instead.</p>`, [{ label: 'OK', val: true, kind: 'primary' }]); return; }
          if (D().categories.length <= 1) { toast('Keep at least one category.'); return; }
          apply({ categories: { del: [c.id] } }, 'Category deleted'); closeSheet(sh);
        };
      }
    });
  }
  function backupJSON() {
    const r = S.real;
    return JSON.stringify({ app: 'time-and-earn', schemaVersion: SCHEMA, exportedAt: new Date().toISOString(), data: { settings: r.settings, jobs: r.jobs, categories: r.categories, activities: r.activities, payments: r.payments } }, null, 1);
  }
  function openRestore() {
    openSheet({
      title: 'Restore backup', render(sh) {
        sh.body.innerHTML = `<p class="prose" style="margin:0">Choose a Time & Earn backup file (.json). You'll see what it contains before anything changes. Restoring replaces all records on this device.</p>
          <div id="rerr"></div>
          <div class="field"><label for="r-file">Backup file</label><input type="file" id="r-file" accept=".json,application/json,text/plain"></div>
          <details><summary>Or paste the backup text</summary><div class="field"><textarea id="r-text" placeholder='{"app":"time-and-earn", …}' style="min-height:140px;font-family:ui-monospace,monospace;font-size:12px"></textarea><button class="btn" id="r-check">Check pasted text</button></div></details>`;
        const handle = async (text) => {
          let obj; try { obj = JSON.parse(text); } catch (e) { obj = null; }
          const errs = obj ? T.validateBackup(obj) : ['The file is not valid JSON.'];
          if (errs.length) { $('#rerr', sh.body).innerHTML = `<div class="errors" role="alert"><strong>This backup can't be restored:</strong><ul>${errs.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>`; return; }
          const d = obj.data;
          const v = await choose('Replace your data?', `<p>The backup${obj.exportedAt ? ' from ' + esc(new Date(obj.exportedAt).toLocaleString('en-GB')) : ''} contains <b>${d.activities.length} activities</b>, ${d.jobs.length} jobs and ${d.categories.length} categories.</p><p>This replaces the ${S.real.activities.length} activities currently saved on this device.</p>`, [{ label: 'Replace with backup', val: true, kind: 'danger solid' }, { label: 'Cancel', val: null, kind: 'ghost' }]);
          if (!v) return;
          const settingsNew = Object.assign({}, DEFAULT_SETTINGS, d.settings || {}, { id: 'settings' });
          const wasDemo = S.demoOn; S.demoOn = false;
          const paymentsNew = { id: 'payments', records: (d.payments && d.payments.records) || {} };
          S.real = { settings: settingsNew, jobs: d.jobs, categories: d.categories, activities: d.activities.map((a) => Object.assign({ breaks: [], segments: [] }, a)), payments: paymentsNew };
          fmtCache = {};
          writeChain = writeChain.then(() => Store.commit({ clear: true, activities: { put: S.real.activities }, jobs: { put: S.real.jobs }, categories: { put: S.real.categories }, settings: settingsNew, payments: paymentsNew }))
            .then(() => toast(`Restored ${d.activities.length} activities`)).catch(() => toast('Restore could not be saved on this device.'));
          if (wasDemo) S.demo = null;
          closeSheet(sh); renderAll();
        };
        $('#r-file', sh.body).onchange = (e) => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => handle(String(rd.result)); rd.onerror = () => { $('#rerr', sh.body).innerHTML = '<div class="errors">Could not read that file.</div>'; }; rd.readAsText(f); };
        $('#r-check', sh.body).onclick = () => handle($('#r-text', sh.body).value);
      }
    });
  }

  // ---------------- demo dataset ----------------
  function buildDemo() {
    const cats = DEFAULT_CATS.map((c) => ({ ...c }));
    const jobs = [{ id: 'demo_job1', name: 'Day job', rate: 12.74, payCycle: T.normCycle({ type: 'monthly', startDay: 14, paydayDay: 30, paydayMonth: 'closing' }) }, { id: 'demo_job2', name: 'Weekend café', rate: 11.44, payCycle: T.normCycle({ type: 'calendar', paydayDay: 7, paydayMonth: 'following' }) }];
    const acts = [];
    const td = today(), y = +td.slice(0, 4), m = +td.slice(5, 7);
    const pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y;
    const dates = T.monthDates(py, pm).concat(T.monthDates(y, m));
    const add = (mode, date, start, end, catId, extra) => acts.push(Object.assign({ id: T.uid('demo_'), mode, date, start, end, endsNextDay: false, categoryId: catId, name: '', paid: false, jobId: null, rate: 0, breaks: [], segments: [], notes: '', paidOverrideMin: null, seriesId: null, createdAt: 0, updatedAt: 0 }, extra || {}));
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const shift = (t, delta) => T.fmtTime(T.parseTime(t) + delta);
    for (const date of dates) {
      const wd = T.weekday(date);
      const plan = [];
      if (wd >= 1 && wd <= 5) {
        plan.push(['00:00', '05:00', 'cat_sleep'], ['05:00', '06:00', 'cat_learn', { name: 'Reading' }], ['06:00', '07:00', 'cat_routine'], ['07:00', '08:00', 'cat_travel'],
          ['08:00', '17:00', 'cat_work', { paid: true, jobId: 'demo_job1', rate: 12.74, breaks: [{ start: '12:00', end: '13:00' }], name: 'Day shift' }], ['17:00', '18:00', 'cat_travel'], ['18:00', '22:00', 'cat_personal'], ['22:00', '00:00', 'cat_sleep', { endsNextDay: true }]);
        if (wd === 2 || wd === 4) plan.splice(6, 1, ['18:00', '19:00', 'cat_exercise', { name: 'Gym' }], ['19:00', '22:00', 'cat_leisure']);
      } else if (wd === 6) {
        plan.push(['00:00', '08:00', 'cat_sleep'], ['08:00', '09:00', 'cat_routine'], ['09:30', '10:00', 'cat_travel'], ['10:00', '14:00', 'cat_work', { paid: true, jobId: 'demo_job2', rate: 11.44, name: 'Café shift' }], ['14:00', '14:30', 'cat_travel'], ['15:00', '18:00', 'cat_leisure'], ['23:00', '00:00', 'cat_sleep', { endsNextDay: true }]);
      } else {
        plan.push(['00:00', '08:30', 'cat_sleep'], ['08:30', '09:30', 'cat_routine'], ['10:00', '11:00', 'cat_exercise', { name: 'Walk' }], ['14:00', '16:00', 'cat_learn', { name: 'Study' }], ['22:00', '00:00', 'cat_sleep', { endsNextDay: true }]);
      }
      plan.forEach(([s, e, c, x]) => add('planned', date, s, e, c, x));
      const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
      if (date <= td) {
        plan.forEach(([s, e, c, x]) => {
          if (date === td && (T.parseTime(e) || 1440) > nowMin) return;
          if (c === 'cat_learn' && rnd() < 0.35) return;
          let s2 = s, e2 = e;
          if (c === 'cat_work' && rnd() < 0.3) { e2 = shift(e, 30); }
          if (c === 'cat_personal' && rnd() < 0.3) e2 = '21:30';
          add('actual', date, s2, e2, c, x);
        });
        // matching travel after a late finish
      }
    }
    // fix overlaps created by overtime: drop actual records that now overlap
    const clean = [];
    for (const r of acts) { if (!T.findOverlaps(r, clean).length) clean.push(r); }
    return { settings: S.real.settings, jobs, categories: cats, activities: clean, payments: emptyPayments() };
  }

  // ---------------- events ----------------
  const H = {
    tab: (el) => { S.ui.tab = el.dataset.tab; renderAll(); window.scrollTo(0, 0); },
    add: (el) => openEditor(newState(el.dataset.date || (S.ui.tab === 'planner' && (S.ui.y !== +today().slice(0, 4) || S.ui.m !== +today().slice(5, 7)) ? S.ui.y + '-' + T.pad(S.ui.m) + '-01' : today()), el.dataset.mode || S.ui.mode)),
    openDay: (el) => openDay(el.dataset.date),
    closeSheet: () => closeSheet(),
    mode: (el) => { S.ui.mode = el.dataset.val; renderAll(); },
    month: (el) => { let m = S.ui.m + +el.dataset.val, y = S.ui.y; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.ui.m = m; S.ui.y = y; renderAll(); },
    today: () => { const td = today(); S.ui.y = +td.slice(0, 4); S.ui.m = +td.slice(5, 7); scrolledFor = ''; renderAll(); },
    sumMonth: (el) => { let m = S.ui.sumM + +el.dataset.val, y = S.ui.sumY; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.ui.sumM = m; S.ui.sumY = y; renderAll(); },
    goSummary: () => { const td = today(); S.ui.sumY = +td.slice(0, 4); S.ui.sumM = +td.slice(5, 7); S.ui.tab = 'summary'; renderAll(); window.scrollTo(0, 0); },
    dashRange: (el) => { S.ui.dashRange = el.dataset.val; renderAll(); },
    tools: () => openTools(),
    dayNav: (el) => { const sh = topSheet(); sh.state.date = T.addDays(sh.state.date, +el.dataset.val); sh.render(sh); },
    dayMode: (el) => { const sh = topSheet(); sh.state.mode = el.dataset.val; S.ui.mode = el.dataset.val; renderTab(); sh.render(sh); },
    edit: (el) => { const r = D().activities.find((x) => x.id === el.dataset.id); if (r) openEditor(stateFromRecord(r)); },
    fMode: (el) => { const sh = topSheet(); readEditor(sh); sh.state.mode = el.dataset.val; renderEditor(sh); },
    addIv: (el) => { const sh = topSheet(); readEditor(sh); const s = sh.state; if (el.dataset.kind === 'b') s.breaks.push({ start: '12:00', end: '12:30' }); else s.segments.push({ start: s.end && !isNaN(T.parseTime(s.end)) ? T.fmtTime(T.parseTime(s.end) - 60) : '', end: s.end, rate: s.rate }); const st = sh.body.scrollTop; renderEditor(sh); sh.body.scrollTop = st; },
    rmIv: (el) => { const sh = topSheet(); readEditor(sh); (el.dataset.kind === 'b' ? sh.state.breaks : sh.state.segments).splice(+el.dataset.i, 1); const st = sh.body.scrollTop; renderEditor(sh); sh.body.scrollTop = st; },
    untilQuick: (el) => { const sh = topSheet(); readEditor(sh); const s = sh.state; if (el.dataset.val === 'month') s.until = endOfMonth(s.date); else { const y = +s.date.slice(0, 4), m = +s.date.slice(5, 7); s.until = endOfMonth((m === 12 ? y + 1 : y) + '-' + T.pad(m === 12 ? 1 : m + 1) + '-01'); } renderEditor(sh); },
    save: () => saveEditor(topSheet()),
    delete: () => deleteFromEditor(topSheet()),
    copyToActual: (el) => copyToActual(el.dataset.date),
    copyDay: (el) => openCopyDay(el.dataset.date, topSheet() && topSheet().state.mode),
    csv: () => { const y = S.ui.sumY, m = S.ui.sumM; offerFile(`time-and-earn-${y}-${T.pad(m)}${S.demoOn ? '-demo' : ''}.csv`, buildCSV(y, m), 'Export CSV'); },
    backup: () => offerFile(`time-and-earn-backup-${today()}.json`, backupJSON(), 'Backup'),
    restore: () => openRestore(),
    wipe: async () => {
      const v = await choose('Delete all your data?', `<p>This removes all ${S.real.activities.length} activities, your jobs and your category changes from this device. It can't be undone. Export a backup first if you might need them.</p>`, [{ label: 'Delete everything', val: true, kind: 'danger solid' }, { label: 'Cancel', val: null, kind: 'ghost' }]);
      if (!v) return;
      S.real = { settings: { ...S.real.settings }, jobs: [], categories: DEFAULT_CATS.map((c) => ({ ...c })), activities: [], payments: emptyPayments() };
      writeChain = writeChain.then(() => Store.commit({ clear: true, categories: { put: S.real.categories }, settings: S.real.settings, payments: S.real.payments }));
      toast('All data deleted'); renderAll();
    },
    theme: (el) => apply({ settings: Object.assign({}, settings(), { theme: el.dataset.val }) }),
    addJob: () => editJob(null), editJob: (el) => editJob(el.dataset.id),
    addCat: () => editCat(null), editCat: (el) => editCat(el.dataset.id),
    basis: (el) => { if (basis() !== el.dataset.val) apply({ settings: Object.assign({}, settings(), { incomeBasis: el.dataset.val }) }); },
    openPay: (el) => { S.ui.payGroup = el.dataset.group; S.ui.payAnchor = el.dataset.start; S.ui.tab = 'summary'; renderAll(); window.scrollTo(0, 0); },
    payGroup: (el) => { S.ui.payGroup = el.dataset.val; S.ui.payAnchor = today(); renderAll(); },
    payStep: (el) => { const g = payGroups().find((x) => x.key === S.ui.payGroup); if (!g) return; const cur = T.periodFor(g.cycle, S.ui.payAnchor) || T.nearestManual(g.cycle, S.ui.payAnchor); const nx = cur && T.stepPeriod(g.cycle, cur, +el.dataset.val); if (nx) { S.ui.payAnchor = nx.start; renderAll(); } },
    payNow: () => { S.ui.payAnchor = today(); renderAll(); },
    payMark: (el) => openPaySheet(el),
    payCsv: () => { const g = payGroups().find((x) => x.key === S.ui.payGroup); if (!g) return; const per = T.periodFor(g.cycle, S.ui.payAnchor) || T.nearestManual(g.cycle, S.ui.payAnchor); if (!per) return; offerFile(`time-and-earn-pay-${per.start}-to-${per.end}${S.demoOn ? '-demo' : ''}.csv`, buildPeriodCSV(g, per), 'Export CSV'); },
    goSettings: () => { S.ui.tab = 'settings'; renderAll(); window.scrollTo(0, 0); },
    demoOn: () => { S.demo = S.demo || buildDemo(); S.demoOn = true; toast('Showing demo data'); renderAll(); },
    demoOff: () => { S.demoOn = false; toast('Back to your data'); renderAll(); }
  };
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || !el.dataset.act || el.disabled) return;
    const fn = H[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', (e) => {
    const on = e.target.dataset && e.target.dataset.on;
    if (on === 'pickMonth' && e.target.value) { const [y, m] = e.target.value.split('-').map(Number); S.ui.y = y; S.ui.m = m; renderAll(); }
    if (on === 'pickSum' && e.target.value) { const [y, m] = e.target.value.split('-').map(Number); S.ui.sumY = y; S.ui.sumM = m; renderAll(); }
    if (on === 'currency') apply({ settings: Object.assign({}, settings(), { currency: e.target.value }) }, 'Currency updated');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheets.length) closeSheet(); });
  // refresh "today" when the app comes back to the foreground
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheets.length) renderAll(); });

  // ---------------- boot ----------------
  async function boot() {
    renderShell();
    await Store.init();
    S.storage = Store.kind;
    try {
      const data = await Store.loadAll();
      if (data.settings) S.real.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings);
      if (Array.isArray(data.jobs)) S.real.jobs = data.jobs;
      if (Array.isArray(data.categories) && data.categories.length) S.real.categories = data.categories;
      if (Array.isArray(data.activities)) S.real.activities = data.activities;
      if (data.payments && data.payments.records && typeof data.payments.records === 'object') S.real.payments = { id: 'payments', records: data.payments.records };
      if (!(Array.isArray(data.categories) && data.categories.length) && Store.kind !== 'memory') Store.commit({ categories: { put: S.real.categories }, settings: S.real.settings }).catch(() => {});
    } catch (e) { console.error(e); toast('Could not read saved data.'); }
    renderAll();
  }
  window.__TE_APP = { S, Store, apply, buildCSV, backupJSON };
  boot();
})();

</script>
