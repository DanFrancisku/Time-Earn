<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopping list · Heywhen</title>
<meta name="description" content="A shopping list shared with you on Heywhen.">
<meta property="og:title" content="🛒 A shopping list for you">
<meta property="og:description" content="Open it in Heywhen to shop together.">
<meta name="theme-color" content="#351E28">
<style>
  :root { --plum: #351E28; --wasabi: #E9F056; --hot: #FF5C34; --bg: #FBF7F2; --line: #E8DDD5; --muted: #6E5B63; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--plum); }
  main { max-width: 520px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); display: grid; gap: 14px; }
  .brand { font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
  .brand span { color: var(--hot); }
  .hero { background: var(--plum); color: #fff; border-radius: 22px; padding: 18px; display: grid; gap: 6px; }
  .hero h1 { margin: 0; font-size: 24px; line-height: 1.2; }
  .hero p { margin: 0; color: #e9dfe4; }
  .cheer { background: rgba(233, 240, 86, 0.4); border-radius: 14px; padding: 10px 14px; font-weight: 600; margin: 0; }
  h3 { margin: 6px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .item { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-weight: 600; }
  .item.done { color: var(--muted); text-decoration: line-through; }
  .item small { color: var(--muted); font-weight: 500; }
  .emoji { font-size: 20px; }
  .btn { display: block; text-align: center; text-decoration: none; border-radius: 16px; padding: 15px; font-weight: 800; font-size: 17px; border: 0; }
  .btn.primary { background: var(--plum); color: var(--wasabi); }
  .btn.ghost { background: #fff; color: var(--plum); border: 1px solid var(--line); }
  .muted { color: var(--muted); margin: 0; text-align: center; font-size: 14px; }
  .group { display: grid; gap: 6px; }
</style>
</head>
<body>
<main>
  <div class="brand">Hey<span>when</span></div>
  <section class="hero" id="hero"><h1>🛒 Loading the list…</h1></section>
  <div id="list" class="group" aria-live="polite"></div>
  <a class="btn primary" id="open" href="#">Open in Heywhen</a>
  <a class="btn ghost" id="get" href="#">Get Heywhen</a>
  <p class="muted">Plan your time, see your earnings and shop together with friends.</p>
</main>
<script>
(function () {
  // Same public key the app uses. It can only read a list when you have the secret code from the link.
  var SB_URL = 'https://oihkjrvsmqqslfoohcbv.supabase.co';
  var SB_KEY = 'sb_publishable_Vf2gblFIqPySISBc0o5Bdw_8ttW3ohW';
  var APP_STORE = ''; // put the App Store link here when Heywhen is live
  var AISLES = [['veg','Fruit & veg','🥦'],['bakery','Bakery','🍞'],['dairy','Dairy & eggs','🥛'],['meat','Meat & fish','🍗'],['cupboard','Cupboard','🥫'],['frozen','Frozen','🧊'],['drinks','Drinks','🧃'],['snacks','Snacks & treats','🍫'],['household','Household','🧽'],['care','Personal care','🧴'],['baby','Baby','🍼'],['other','Other','🛍️']];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var m = location.search.match(/[?&]t=([a-f0-9]{16,64})/i);
  var tok = m ? m[1].toLowerCase() : '';
  var hero = document.getElementById('hero'), list = document.getElementById('list');
  document.getElementById('open').href = 'heywhen://list?t=' + tok;
  var get = document.getElementById('get');
  if (APP_STORE) get.href = APP_STORE; else { get.textContent = 'Heywhen is coming soon to the App Store'; get.removeAttribute('href'); }
  if (!tok) { hero.innerHTML = '<h1>This link is not complete</h1><p>Ask your friend to send it again.</p>'; return; }
  fetch(SB_URL + '/rest/v1/rpc/shop_list_by_token', { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ tok: tok }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.items) { hero.innerHTML = '<h1>This list is not available</h1><p>It may have been deleted.</p>'; return; }
      var who = d.by ? esc(String(d.by).split(' ')[0]) : 'A friend';
      var left = d.items.filter(function (x) { return !x.done; });
      hero.innerHTML = '<h1>🛒 ' + (d.circle ? esc((d.emoji || '') + ' ' + d.circle) : esc(d.name)) + '</h1><p>' + who + ' shared this shopping list with you · ' + left.length + ' to buy</p>';
      var html = '<p class="cheer">' + (left.length ? 'Thank you for helping! 💛' : 'Everything is bought 🎉') + '</p>';
      AISLES.forEach(function (a) {
        var its = d.items.filter(function (x) { return (x.aisle || 'other') === a[0]; });
        if (!its.length) return;
        html += '<h3>' + a[2] + ' ' + esc(a[1]) + '</h3>' + its.map(function (x) {
          return '<div class="item' + (x.done ? ' done' : '') + '"><span class="emoji">' + esc(x.emoji || '🛒') + '</span><span>' + esc(x.name) + (x.qty ? ' <small>× ' + esc(x.qty) + '</small>' : '') + '</span></div>';
        }).join('');
      });
      list.innerHTML = html;
    })
    .catch(function () { hero.innerHTML = '<h1>Could not load the list</h1><p>Check your internet and try again.</p>'; });
})();
</script>
</body>
</html>
